sentence=Send readings to your Warblet dashboard and react to its commands over HTTPS or MQTT, from a short sketch.
paragraph=Readings go to warbletiot.com as text or in two bytes, signed with HMAC-SHA256 when the board has a key, and the dashboard's commands come back to a function in your sketch. Wi-Fi and the device's settings come from the Warblet setup page over USB. For ESP32 boards.
